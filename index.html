<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khayyat — Producer</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Inter:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: url('https://images.unsplash.com/photo-1614850523232-1c3eafd75e55?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 0;
    }
    .content {
      position: relative;
      z-index: 1;
      padding: 20px;
    }
    h1 {
      font-family: 'Bebas Neue', 'Anton', sans-serif;
      font-size: 5rem;
      letter-spacing: 3px;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 1.2rem;
      color: #bbb;
      margin-bottom: 2.5rem;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 320px;
      margin: 0 auto;
    }
    a {
      display: block;
      padding: 14px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
    }
    a:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.03);
    }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="content">
    <h1>Khayyat</h1>
    <p>Producer • Sound Engineer</p>

    <div class="links">

      <a href="https://play.anghami.com/artist/6728735" target="_blank">Anghami</a>
      <a href="https://soundcloud.com/khvyyvt" target="_blank">SoundCloud</a>
      <a href="https://www.instagram.com/justkhayyat" target="_blank">Instagram</a>
      <a href="https://www.tiktok.com/@justkhayyat" target="_blank">TikTok</a>
      <a href="mailto:khayyat@svnbirds.com">Email</a>
    </div>
