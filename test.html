<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chrome Text Test</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chrome-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 100px;
      font-weight: 700;
      color: #ccc;
      background: linear-gradient(180deg, 
        #f5f5f5 0%, 
        #bcbcbc 20%, 
        #7a7a7a 40%, 
        #f5f5f5 60%, 
        #d9d9d9 80%, 
        #8c8c8c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      position: relative;
      text-transform: lowercase;
    }

    .chrome-text::after {
      content: 'khayyat';
      position: absolute;
      left: 3px;
      top: 3px;
      background: none;
      -webkit-background-clip: text;
      -webkit-text-fill-color: rgba(255, 255, 255, 0.2);
      filter: blur(2px);
    }
  </style>
</head>
<body>
  <div class="chrome-text">khayyat</div>
</body>
</html>
